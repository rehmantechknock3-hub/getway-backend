# Render Blueprint — API + admin web + Postgres
# Dashboard: New → Blueprint → this repo (branch feat/ui-improvements or main)
# Predicted URLs:
#   API  https://getway-api.onrender.com
#   Web  https://getway-web.onrender.com
# Fill sync:false env vars in the Render dashboard from apps/api/.env and apps/web/.env.local.
# Clerk webhook: https://getway-api.onrender.com/api/v1/webhooks/clerk

databases:
  - name: getway-db
    databaseName: marketplace
    user: getway
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: getway-api
    runtime: node
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /api/v1/health
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @repo/api build
    preDeployCommand: pnpm --filter @repo/api db:migrate:deploy
    startCommand: pnpm --filter @repo/api start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: getway-db
          property: connectionString
      - key: WEB_URL
        value: https://getway-web.onrender.com
      - key: SOCKET_CORS_ORIGIN
        value: https://getway-web.onrender.com
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_COMMISSION_PERCENT
        value: "15"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false

  - type: web
    name: getway-web
    runtime: node
    plan: free
    region: oregon
    autoDeploy: true
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @repo/schemas build && pnpm --filter @repo/web build
    startCommand: pnpm --filter @repo/web exec next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://getway-api.onrender.com
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://getway-api.onrender.com
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL
        value: /dashboard
